name: Feature request / 功能建议
description: 提出使用场景和预期结果。
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 说明使用场景及当前阻碍。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期行为
      description: 描述可观察的结果，必要时提供虚构示例。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与替代方式
      description: 可说明涉及平台、连接方式、已有替代方式及是否属于首期范围。
